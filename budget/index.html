<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>預算設定</title>


  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>


  <!-- Bootstrap -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
    rel="stylesheet">


  <!-- 自訂 CSS -->
  <link 
    rel="stylesheet" 
    href="style.css?v=20260712v2">


  <!-- JS -->
  <script 
    src="app.js?v=20260712v2" 
    defer>
  </script>


</head>


<body>


<div class="container app-container">


  <h4 class="mb-3 text-center">
    💰 預算設定
  </h4>



  <!-- ================= -->
  <!-- 收入預算 -->
  <!-- ================= -->

  <div class="budget-section income-section">


    <h5 class="section-title">
      🟢 收入預算
    </h5>


    <div 
      id="income-form"
      class="border rounded p-2">

    </div>


    <div 
      class="total-box income-total-box d-flex justify-content-between mt-2">

      <strong>
        收入合計
      </strong>


      <strong id="income-total">
        0
      </strong>

    </div>


  </div>





  <!-- ================= -->
  <!-- 支出預算 -->
  <!-- ================= -->


  <div class="budget-section expense-section mt-4">


    <h5 class="section-title">
      🔴 支出預算
    </h5>


    <div 
      id="expense-form"
      class="border rounded p-2">

    </div>


    <div 
      class="total-box expense-total-box d-flex justify-content-between mt-2">

      <strong>
        支出合計
      </strong>


      <strong id="expense-total">
        0
      </strong>

    </div>


  </div>





  <!-- ================= -->
  <!-- 總結 -->
  <!-- ================= -->

<!--
  <div 
    class="total-box d-flex justify-content-between mt-4">


    <strong>
      每月支出預算
    </strong>


    <strong id="total">
      0
    </strong>


  </div>
-->




  <!-- 儲存 -->

  <button 
    class="btn btn-primary w-100 mt-3"
    onclick="submitBudget()">

    💾 儲存

  </button>




  <!-- 狀態 -->

  <div 
    id="status"
    class="mt-3 text-center text-success">

  </div>


</div>


</body>

</html>
