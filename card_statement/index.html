
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>信用卡帳單查詢</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>

<body class="bg-light">

  <div class="container py-4" style="max-width: 600px;">

    <h4 class="mb-4">💳 信用卡帳單查詢</h4>

    <!-- 狀態訊息 -->
    <div id="status" class="alert alert-info">
      正在初始化...
    </div>

    <!-- 信用卡選擇 -->
    <div class="card mb-3">
      <div class="card-body">
        <label for="cardSelect" class="form-label fw-bold">
          選擇信用卡
        </label>

        <select id="cardSelect" class="form-select" disabled>
          <option value="">請選擇信用卡</option>
        </select>
      </div>
    </div>

    <!-- 帳單期間選擇 -->
    <div class="card mb-3">
      <div class="card-body">
        <label for="monthSelect" class="form-label fw-bold">
          選擇帳單期間
        </label>

        <select id="monthSelect" class="form-select" disabled>
          <option value="">請先選擇信用卡</option>
        </select>
      </div>
    </div>

    <!-- 消費明細 -->
    <div id="resultArea" class="d-none">

      <div class="card mb-3">
        <div class="card-body">
          <div class="text-secondary small">本期消費合計</div>
          <div id="totalAmount" class="fs-3 fw-bold">
            $0
          </div>
          <div id="recordCount" class="text-secondary small">
            共 0 筆
          </div>
        </div>
      </div>

      <h5 class="mb-3">消費明細</h5>

      <div id="detailList"></div>

    </div>

  </div>

  <script src="./app.js"></script>

</body>
</html>
